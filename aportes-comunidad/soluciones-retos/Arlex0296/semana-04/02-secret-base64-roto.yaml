# 💥 Reto 02: Secret con referencia rota (CreateContainerConfigError)
# Objetivo: El Pod no logra arrancar porque busca un Secret con nombre equivocado y clave errónea.
# Pista: Revisa `kubectl get secrets` y `kubectl describe pod caja-reto-02`.

apiVersion: v1
kind: Secret
metadata:
  name: credenciales-kubecafe
type: Opaque
stringData:
  API_TOKEN: "kubecafe-super-token-2026"
---
apiVersion: v1
kind: Pod
metadata:
  name: caja-reto-02
spec:
  containers:
    - name: caja
      image: busybox:1.36
      command: ["sh", "-c", "echo Token cargado && sleep 3600"]
      env:
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: credenciales-kubecafe   
              key: API_TOKEN