# 💥 Reto 05: ConfigMap montado como volumen con clave errónea (ContainerCreating)
# Objetivo: El Pod nunca pasa a Running porque el volumen del ConfigMap busca una clave que no existe.
# Pista: Usa `kubectl describe pod web-reto-05` y revisa la sección `Events` (`MountVolume.SetUp failed`).

apiVersion: v1
kind: ConfigMap
metadata:
  name: menu-html-reto-05
data:
  pagina.html: |
    <h1>☕ Menú KubeCafé Reto 05</h1>
---
apiVersion: v1
kind: Pod
metadata:
  name: web-reto-05
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: html-vol
          mountPath: /usr/share/nginx/html
  volumes:
    - name: html-vol
      configMap:
        name: menu-html-reto-05
        items:
          - key: pagina.html
            path: index.html
