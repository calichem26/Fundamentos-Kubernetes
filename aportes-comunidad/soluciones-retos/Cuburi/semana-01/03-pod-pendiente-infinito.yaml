# 🚨 RETO 3 (Nivel Medio): El Pod demasiado exigente 🚨
# Síntoma: El Pod se crea, pero se queda en estado 'Pending' para siempre y nunca arranca.
# Pista: El Scheduler está buscando un servidor libre pero ninguno cumple los requisitos.
#        Ejecuta '  ' y mira por qué el Scheduler lo rechazó.
# Respuesta: El Pod solicitaba demasiados recursos (500Gi de memoria y 64 CPU). Como ningún nodo tenía suficientes recursos disponibles se 
#           queda en pending

apiVersion: v1
kind: Pod
metadata:
  name: reto-03-exigente
  labels:
    reto: "3"
spec:
  containers:
    - name: app-glotona
      image: nginx:alpine
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"