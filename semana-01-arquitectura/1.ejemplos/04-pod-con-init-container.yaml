# ==============================================================================
# 🧼 EJEMPLO 04: Pod con InitContainer (Inicialización Previa Bloqueante)
# ==============================================================================
# Nombre del Pod en el clúster: pod-con-init-container
# InitContainer: inicializador (Busybox preparando /trabajo/index.html)
# Contenedor Principal: servidor-web (Nginx en puerto 80)
# Ejecutar: kubectl apply -f 04-pod-con-init-container.yaml
# Probar:   kubectl port-forward pod/pod-con-init-container 8080:80 -> http://localhost:8080
# Limpiar:  kubectl delete -f 04-pod-con-init-container.yaml
# ==============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: pod-con-init-container
  labels:
    comunidad: cloud-native-medellin
    semana: "1"
    patron: init-container
spec:
  volumes:
    - name: datos-inicio
      emptyDir: {}

  # Los initContainers se ejecutan y deben finalizar con código 0
  # ANTES de que los contenedores de la sección containers arranquen.
  initContainers:
    - name: inicializador
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "[InitContainer] Preparando archivos y verificando dependencias..."
          sleep 4
          cat <<EOF > /trabajo/index.html
          <!DOCTYPE html>
          <html>
          <body style="font-family: sans-serif; background: #042f2e; color: #ccfbf1; padding: 2rem;">
            <h2>✅ Inicialización Exitosa</h2>
            <p>Este archivo fue generado por el <strong>initContainer</strong> antes de que Nginx iniciara.</p>
          </body>
          </html>
          EOF
          echo "[InitContainer] Finalizado con éxito."
      volumeMounts:
        - name: datos-inicio
          mountPath: /trabajo

  containers:
    - name: servidor-web
      image: nginx:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: datos-inicio
          mountPath: /usr/share/nginx/html
