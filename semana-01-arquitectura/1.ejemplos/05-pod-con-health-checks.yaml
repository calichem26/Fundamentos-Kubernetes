# ==============================================================================
# 🌡️ EJEMPLO 05: Pod con Sondas de Salud (Readiness y Liveness Probes)
# ==============================================================================
# Nombre del Pod en el clúster: pod-con-health-checks
# Contenedor: servidor-saludable (Nginx en puerto 80)
# Sondas:
#   - readinessProbe: HTTP GET / :80 (initialDelay: 3s, period: 5s)
#   - livenessProbe:  HTTP GET / :80 (initialDelay: 5s, period: 10s)
# Ejecutar: kubectl apply -f 05-pod-con-health-checks.yaml
# Probar:   kubectl describe pod pod-con-health-checks
# Limpiar:  kubectl delete -f 05-pod-con-health-checks.yaml
# ==============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: pod-con-health-checks
  labels:
    comunidad: cloud-native-medellin
    semana: "1"
    tipo: resiliencia
spec:
  containers:
    - name: servidor-saludable
      image: nginx:alpine
      ports:
        - containerPort: 80
      # readinessProbe: Determina si el pod está listo para recibir tráfico de red
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 5
      # livenessProbe: Determina si la aplicación sigue viva o si el contenedor debe ser reiniciado
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
